<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#1F2B5B">
  <title>MathClicks — IGCSE &amp; SAT Math</title>
  <meta name="description" content="Free IGCSE 0580 and American Pathway math lessons by Mr Ahmed Hamouda — worked examples, interactive quizzes, and past-paper practice with mark schemes.">
  <!-- Open Graph (og:image must be 1200x630 — create assets/og-card.png in Canva at that size) -->
  <meta property="og:title" content="MathClicks — IGCSE &amp; American Pathway Math">
  <meta property="og:description" content="Free IGCSE 0580 and American Pathway math lessons by Mr Ahmed Hamouda — worked examples, interactive quizzes, and past-paper practice with mark schemes.">
  <meta property="og:image" content="https://mrahmedhamouda-oss.github.io/mathclicks/assets/og-card.png">
  <meta property="og:url" content="https://mrahmedhamouda-oss.github.io/mathclicks/">
  <meta property="og:type" content="website">
  <meta name="twitter:card" content="summary_large_image">
  <script>
    /* Apply saved theme before first paint to avoid a flash */
    try {
      var t = localStorage.getItem("mathclicks.theme");
      if (t === "dark" || (!t && matchMedia("(prefers-color-scheme: dark)").matches))
        document.documentElement.dataset.theme = "dark";
    } catch (e) {}
  </script>
  <!-- Fonts + KaTeX are self-hosted in vendor/ so the site keeps working on
       networks that block CDNs (school wifi!) -->
  <link rel="stylesheet" href="vendor/fonts/fonts.css">
  <link rel="stylesheet" href="css/style.css?v=20">
  <!-- game.css/game.js load on the #/game route; lesson-embed.css loads with
       the first embedded lesson (see loadCssOnce/loadScriptOnce in js/app.js) -->
  <link rel="icon" href="favicon.ico" sizes="48x48">
  <link rel="icon" type="image/png" href="assets/mathclicks-icon-48.png" sizes="48x48">
  <link rel="apple-touch-icon" href="assets/mathclicks-icon-180.png">
  <link rel="stylesheet" href="vendor/katex/katex.min.css">
  <script defer src="vendor/katex/katex.min.js"></script>
  <script defer src="vendor/katex/auto-render.min.js"></script>
  <!-- Cloudflare Web Analytics — privacy-friendly, no cookies.
       SETUP (see README "Analytics"): get your site token from the Cloudflare
       dashboard, replace CLOUDFLARE_TOKEN_HERE below, and UNCOMMENT the script.
       It stays commented out until then so students don't load a dead beacon.
  <script defer src="https://static.cloudflareinsights.com/beacon.min.js"
          data-cf-beacon='{"token": "CLOUDFLARE_TOKEN_HERE"}'></script>
  -->
</head>
<body>

  <a class="skip-link" href="#main">Skip to content</a>
  <noscript>
    <p style="max-width:36rem;margin:3rem auto;padding:0 1rem;font-family:system-ui,sans-serif;text-align:center;">
      MathClicks needs JavaScript to load its lessons — please enable it in
      your browser and refresh the page.
    </p>
  </noscript>

  <div id="site">
    <header class="topnav">
      <div class="topnav-inner">
        <a href="#/" class="brand" aria-label="MathClicks home">
          <picture>
            <source srcset="assets/mathclicks-icon-68.webp" type="image/webp">
            <img class="brand-logo" src="assets/mathclicks-icon.png" width="34" height="34" alt="" aria-hidden="true">
          </picture>
          <span class="brand-name"><span class="bn-math">Math</span><span class="bn-clicks">Clicks</span></span>
        </a>
        <div class="nav-tools">
          <nav id="nav-links" class="nav-links" aria-label="Main navigation">
            <a class="nav-link" data-nav="home" href="#/">Home</a>
            <a class="nav-link" data-nav="igcse" href="#/igcse">IGCSE</a>
            <a class="nav-link" data-nav="ap" href="#/modules">American Pathway</a>
            <a class="nav-link" data-nav="test" href="#/test">🎯 Test Me</a>
            <a class="nav-link" data-nav="game" href="#/game">🎮 Game</a>
            <a class="nav-link" data-nav="about" href="#/about">About</a>
          </nav>
          <button id="exam-chip" class="tool-chip" type="button" title="Set your exam date">📅 <span id="exam-chip-label">Exam date</span><span id="exam-chip-short" class="exam-chip-short" aria-hidden="true"></span></button>
          <button id="theme-toggle" class="tool-chip tool-icon" type="button" aria-label="Toggle dark mode">🌙</button>
          <button id="nav-search" class="tool-chip" type="button" aria-label="Search lessons">
            🔍 <span class="nav-search-label">Search</span>
          </button>
          <button id="nav-menu" class="tool-chip tool-icon nav-menu-btn" type="button" aria-label="Open menu" aria-expanded="false" aria-controls="nav-links">☰</button>
        </div>
      </div>
    </header>

    <main id="main" data-view="home" tabindex="-1"></main>

    <footer class="site-footer">
      <div class="footer-inner">
        <div class="footer-brand">
          <picture>
            <source srcset="assets/mathclicks-logo-300.webp" type="image/webp">
            <img class="footer-logo" src="assets/mathclicks-logo.png" alt="MathClicks" width="150" height="150" loading="lazy" decoding="async">
          </picture>
          <p class="footer-tag">IGCSE &amp; American Pathway math, one click at a time.</p>
        </div>
        <div class="footer-social">
          <a class="social-btn" href="https://www.youtube.com/channel/UC6QrK419Gg5w1SXzlBbYXCw" target="_blank" rel="noopener">
            <span aria-hidden="true">▶</span> YouTube
          </a>
          <a class="social-btn" href="TIKTOK_URL_HERE" target="_blank" rel="noopener">
            <span aria-hidden="true">♪</span> TikTok
          </a>
        </div>
      </div>
      <p class="footer-small">© 2026 MATHCLICKS BY HAMOUDA · IGCSE &amp; American Pathway math, one click at a time</p>
    </footer>
  </div>

  <!-- Lesson search overlay -->
  <div id="search-overlay" class="search-overlay hidden" role="dialog" aria-modal="true" aria-label="Search lessons">
    <div class="search-panel">
      <div class="search-bar">
        <span class="search-icon" aria-hidden="true">🔍</span>
        <input id="search-input" type="search" placeholder="Search lessons — try “quadratic”" autocomplete="off" aria-label="Search lessons">
        <button id="search-close" class="search-close" type="button" aria-label="Close search">✕</button>
      </div>
      <div id="search-results" class="search-results"></div>
    </div>
  </div>

  <!-- Floating action buttons (stacked bottom-right) -->
  <div class="fab-stack">
    <button id="fab" class="fab fab-formula" type="button" aria-label="Open formula sheet">
      <span aria-hidden="true">📐</span><span class="fab-label">Formulas</span>
    </button>
    <button id="ask-fab" class="fab fab-ask" type="button" aria-label="Ask Mr Hamouda a math question">
      <span class="ask-avatar" aria-hidden="true">🧑🏻‍🏫</span><span class="fab-label">Ask Mr Hamouda</span>
    </button>
  </div>

  <!-- Formula-sheet slide-out panel -->
  <div id="fpanel-backdrop" class="fpanel-backdrop hidden"></div>
  <aside id="fpanel" class="fpanel" aria-label="Formula sheet" aria-hidden="true">
    <div class="fpanel-head">
      <strong>📐 Formula Sheet</strong>
      <button id="fpanel-close" class="icon-close" type="button" aria-label="Close formula sheet">✕</button>
    </div>
    <div id="fpanel-body" class="fpanel-body"></div>
  </aside>

  <!-- Ask Mr Hamouda chat -->
  <div id="chat-backdrop" class="chat-backdrop hidden"></div>
  <section id="chat" class="chat" aria-label="Ask Mr Hamouda" aria-hidden="true">
    <div class="chat-head">
      <span class="chat-avatar" aria-hidden="true">🧑🏻‍🏫</span>
      <div class="chat-id">
        <strong>Mr Hamouda</strong>
        <span class="chat-status"><span class="chat-dot"></span> Instant math solver</span>
      </div>
      <button id="chat-close" class="icon-close" type="button" aria-label="Close chat">✕</button>
    </div>
    <div id="chat-log" class="chat-log" role="log" aria-live="polite"></div>
    <div id="chat-chips" class="chat-chips"></div>
    <form id="chat-form" class="chat-form">
      <input id="chat-input" type="text" autocomplete="off" placeholder="Ask a math question…" aria-label="Ask a math question">
      <button type="submit" class="chat-send" aria-label="Send">➤</button>
    </form>
  </section>

  <!-- Generic modal (tricks, exam date) -->
  <div id="modal" class="modal hidden" role="dialog" aria-modal="true">
    <div class="modal-panel">
      <button id="modal-close" class="icon-close" type="button" aria-label="Close">✕</button>
      <div id="modal-body"></div>
    </div>
  </div>

  <script defer src="js/app.js?v=28"></script>
</body>
</html>
